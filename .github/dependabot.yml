# Template repo only. Applying a flavour replaces this file with the flavour's own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [enhancement, agent:zeus]
  - package-ecosystem: npm
    directory: /flavours/node-docker
    schedule:
      interval: weekly
    labels: [enhancement, agent:zeus]
  - package-ecosystem: docker
    directory: /flavours/node-docker
    schedule:
      interval: weekly
    labels: [enhancement, agent:zeus]
