name: Pin freshness

# Dependabot does not update tool versions pinned inside workflow run: steps.
# This opens (or updates) one issue when any of them is behind the latest release.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pins with latest releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/check-pins.sh > pins.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat pins.txt
      - name: Open or update the issue when pins are behind
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tool pins are behind the latest release"
          {
            echo "Weekly pin check found tools pinned behind their latest release."
            echo
            grep -E '^(BEHIND|[0-9]+ pin)' pins.txt | sed 's/^/    /'
            echo
            echo "Update each pin (tag and digest) in the workflow, run: bash scripts/check.sh, then open a PR."
          } > body.md
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
      - name: Fail on lookup errors
        if: steps.check.outputs.code == '2'
        run: exit 1
