# Lint and security gates. Managed by the template and kept out of ci.yml on purpose:
# scripts/apply-flavour.sh overwrites ci.yml with the flavour's, so gates living there are lost
# in adopted repos. Paths under flavours/ exist only in the template; globs tolerate both layouts.
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 5 1 * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (workflows, with shellcheck)
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml flavours/*/.github/workflows/*.yml)
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color "${files[@]}"
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh flavours/*/scripts/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi
      - name: yamllint
        run: |
          python3 -m pip install --quiet yamllint==1.38.0
          yamllint -c .yamllint.yml .
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"

  # Not a required check until it has run clean for a week.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (secrets, full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose /repo
      - name: zizmor (workflow security)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d \
            --offline .
      - name: pinact (every action pinned to a full SHA whose version comment is true)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Release binary, not an image: pinact publishes no container image. The checksum pins the exact build.
          gh release download v5.0.2 -R suzuki-shunsuke/pinact -p pinact_linux_amd64.tar.gz
          echo "7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7  pinact_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf pinact_linux_amd64.tar.gz pinact
          ./pinact run --check --verify
          rm -f pinact pinact_linux_amd64.tar.gz
      - name: hadolint (every Dockerfile)
        run: |
          shopt -s nullglob
          for df in Dockerfile flavours/*/Dockerfile; do
            [ -f "$df" ] || continue
            echo "== $df"
            docker run --rm -i \
              hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
              < "$df" || exit 1
          done
      - name: Trivy config scan (Dockerfiles and compose files, whole tree)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            config --exit-code 1 --severity HIGH,CRITICAL .
      - name: osv-scanner (dependency vulnerabilities)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source -r /repo
          rc=$?
          # 128 = no lockfiles found; the template ships none (flavour lockfiles are generated per repo)
          if [ "$rc" -eq 128 ]; then echo "no lockfiles to scan"; exit 0; fi
          exit "$rc"
