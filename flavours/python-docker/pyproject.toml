[project]
name = "app"
version = "0.1.0"
description = "FastAPI + Postgres service (python-docker flavour)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.uv]
# An application run from its source tree, not an installable package.
package = false
# Do not resolve packages published in the last 7 days (supply-chain cooldown, as in dependabot.yml).
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call defaults, e.g. `db: Session = Depends(get_db)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare assert.
"tests/**" = ["S101"]
