name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files exist
        run: |
          missing=0
          for f in README.md AGENTS.md GLOSSARY.md LICENSE docs/adr/INDEX.md .github/CODEOWNERS; do
            [ -f "$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing

  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts && npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build Docker image
        run: docker build -t app:ci .
      - name: Trivy image scan (CVEs in OS packages and libraries; HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress app:ci
      - name: Trivy config scan (Dockerfile and compose misconfigurations)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            config --exit-code 1 --severity HIGH,CRITICAL --no-progress .
      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 3000:3000 app:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed"
          docker logs smoke
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
